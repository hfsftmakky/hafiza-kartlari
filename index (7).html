<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hafıza Kartları · Konuyu yaz, makaleleri dinle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#14213d; --muted:#5a6786; --line:#d5dbe8;
  --accent:#2b4eff; --accent-ink:#ffffff; --hl:#ffd84d; --hl-ink:#14213d; --ok:#1f9d8b; --err:#c2362f;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --rail:232px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1325; --panel:#171e36; --ink:#e8ecf8; --muted:#9aa6c8; --line:#2a3358;
    --accent:#7d94ff; --accent-ink:#0e1325; --hl:#ffd84d; --hl-ink:#14213d; --ok:#45d0bb; --err:#ff7b72;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1325; --panel:#171e36; --ink:#e8ecf8; --muted:#9aa6c8; --line:#2a3358;
  --accent:#7d94ff; --accent-ink:#0e1325; --hl:#ffd84d; --hl-ink:#14213d; --ok:#45d0bb; --err:#ff7b72;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,5.2vw,3.8rem);font-weight:800}
h2{font-size:1.7rem;font-weight:800}
h3{font-size:1.2rem;font-weight:600}
p{margin:0 0 1em;max-width:68ch}
a{color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;margin-bottom:22px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand i{width:30px;height:38px;border:2.5px solid var(--ink);border-radius:5px;position:relative;display:inline-block;background:var(--panel)}
.brand i::after{content:"";position:absolute;left:5px;right:5px;top:11px;height:7px;background:var(--hl);border-radius:2px}
.rail a.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600}
.rail a.nav[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.rail a.nav:hover{color:var(--ink)}
.rail .sp{flex:1}
.theme{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--muted);font-family:var(--display)}
main{padding:44px clamp(18px,4vw,56px) 150px;max-width:1040px;width:100%}
.view>*{max-width:100%}

/* hero */
.hero p.lead{font-size:1.2rem;color:var(--muted)}
.mark{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 .08em}
.ask{margin-top:28px;background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:14px;display:grid;gap:12px;box-shadow:6px 6px 0 var(--ink)}
.ask textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:84px;font-size:1.15rem;font-family:var(--body)}
.ask textarea:focus-visible{outline:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 22px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.05rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 14px;font-size:.92rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-family:var(--display);font-size:.95rem}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.notice{margin-top:26px;border-left:4px solid var(--hl);padding:6px 0 6px 14px;color:var(--muted);font-size:.95rem}

/* progress */
.steps{list-style:none;padding:0;margin:28px 0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted)}
.steps li.on{color:var(--ink);border-color:var(--accent)}
.steps li.done{color:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.on .dot{border-color:var(--accent);background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.done .dot{background:var(--ok);border-color:var(--ok)}
@keyframes pulse{50%{transform:scale(.6)}}

/* cards */
.grid{display:grid;gap:22px;margin-top:26px}
.card{background:var(--panel);border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;position:relative}
.card .top{padding:18px 22px 10px;border-bottom:1.5px solid var(--line);background:
  repeating-linear-gradient(transparent 0 27px,color-mix(in srgb,var(--line) 70%,transparent) 27px 28px)}
.card .src{font-family:var(--display);font-size:.88rem;color:var(--muted)}
.card h3{margin:.2em 0 .3em;font-size:1.3rem}
.card .body{padding:16px 22px 20px}
.oneliner{font-family:var(--display);font-size:1.18rem;font-weight:600;margin:0 0 14px;max-width:none}
.pts{margin:0 0 16px;padding-left:1.2em}
.pts li{margin-bottom:.35em}
.hook{background:var(--hl);color:var(--hl-ink);border-radius:10px;padding:12px 14px;font-weight:600;margin:0 0 14px;max-width:none}
.hook small{display:block;font-family:var(--display);font-weight:600;opacity:.75;margin-bottom:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tag{font-family:var(--display);font-size:.82rem;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.recall{margin-top:14px;border-top:1.5px dashed var(--line);padding-top:12px}
.recall .a{display:none;margin-top:8px;color:var(--ok);font-weight:600}
.recall.open .a{display:block}

/* podcast */
.script{display:grid;gap:12px;margin-top:22px}
.line{display:grid;grid-template-columns:86px 1fr;gap:14px;padding:12px 14px;border-radius:12px;border:1px solid transparent}
.line .who{font-family:var(--display);font-weight:800;color:var(--muted)}
.line.cur{background:var(--panel);border-color:var(--accent)}
.line.cur .who{color:var(--accent)}
.line p{margin:0;max-width:none}
.line .dir{color:var(--muted);font-size:.85em;font-family:var(--display)}

/* report */
.rep{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin:18px 0}
.rep h3{margin-bottom:.4em}
.rep p{white-space:pre-wrap}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0;overflow-x:auto}
.diagram svg{max-width:100%;height:auto}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:.85rem}

/* history & settings */
.hist{display:grid;gap:10px;margin-top:20px}
.hitem{display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.hitem b{font-family:var(--display)}
.hitem small{color:var(--muted);display:block}
label.f{display:grid;gap:6px;margin:16px 0;font-family:var(--display);font-weight:600}
input[type=text],input[type=url]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-family:var(--body)}
.check{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:600}
.err{border-left:4px solid var(--err);padding:8px 0 8px 14px;margin:18px 0}

/* player bar */
.player{position:fixed;left:var(--rail);right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px clamp(16px,4vw,40px) calc(12px + env(safe-area-inset-bottom,0px));display:none;gap:14px;align-items:center;z-index:20}
.player.show{display:flex}
.player .t{flex:1;min-width:0;font-family:var(--display)}
.player .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .t span{font-size:.85rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.player button{background:var(--hl);color:var(--hl-ink);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-family:var(--display);font-weight:700}
.player button.q{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.bars s{display:block;width:4px;background:var(--hl);height:6px;border-radius:2px}
.player.speaking .bars s{animation:eq .8s ease-in-out infinite}
.player.speaking .bars s:nth-child(2){animation-delay:.15s}.player.speaking .bars s:nth-child(3){animation-delay:.3s}.player.speaking .bars s:nth-child(4){animation-delay:.45s}
@keyframes eq{50%{height:22px}}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--bg);z-index:30;justify-content:space-around}
  .rail .brand,.rail .sp,.rail .theme{display:none}
  .rail a.nav{flex-direction:column;gap:0;font-size:.72rem;padding:6px 8px;box-shadow:none!important}
  main{padding-bottom:190px}
  .player{left:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:12px}
  .line{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Ana menü">
    <a class="brand" href="#/"><i></i>Hafıza Kartları</a>
    <a class="nav" data-r="" href="#/">Ara</a>
    <a class="nav" data-r="sonuc" href="#/sonuc">Makaleler</a>
    <a class="nav" data-r="dinle" href="#/dinle">Dinle</a>
    <a class="nav" data-r="rapor" href="#/rapor">Rapor</a>
    <a class="nav" data-r="gecmis" href="#/gecmis">Geçmiş</a>
    <a class="nav" data-r="ayarlar" href="#/ayarlar">Ayarlar</a>
    <div class="sp"></div>
    <button class="theme" id="themeBtn" type="button">Tema: otomatik</button>
  </nav>
  <main><div id="view" class="view"></div></main>
</div>

<div class="player" id="player" role="region" aria-label="Ses oynatıcı">
  <div class="bars" aria-hidden="true"><s></s><s></s><s></s><s></s></div>
  <div class="t"><b id="pTitle">Hazır</b><span id="pSub"></span></div>
  <button id="pToggle" type="button">Duraklat</button>
  <button id="pStop" class="q" type="button">Kapat</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function(){
"use strict";

/* ========== Ayarlar & depolama ========== */
var DEFAULTS = { webhook:"https://proje41.app.n8n.cloud/webhook/arastirma", audience:"Genel İzleyici", demo:false };
var KEY_CFG="hk_cfg", KEY_HIST="hk_hist", KEY_THEME="hk_theme";
function load(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var cfg = Object.assign({}, DEFAULTS, load(KEY_CFG,{}));
var history = load(KEY_HIST,[]);
var current = null;          // son araştırma sonucu
var pendingTopic = "";

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function safeUrl(u){ return /^https?:\/\//i.test(u||"") ? u : ""; }
function $(s,r){ return (r||document).querySelector(s); }
var view = $("#view");

/* ========== Tema ========== */
var themeBtn = $("#themeBtn");
function applyTheme(t){
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.textContent = "Tema: " + (t==="light"?"açık":t==="dark"?"koyu":"otomatik");
  try{ initMermaid(); }catch(e){}
}
var theme = load(KEY_THEME,"auto"); applyTheme(theme);
themeBtn.addEventListener("click",function(){
  theme = theme==="auto"?"light":theme==="light"?"dark":"auto"; save(KEY_THEME,theme); applyTheme(theme);
});

/* ========== Mermaid ========== */
function isDark(){ var t=document.documentElement.getAttribute("data-theme"); return t==="dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches); }
function initMermaid(){ if(window.mermaid) mermaid.initialize({startOnLoad:false, securityLevel:"strict", theme:isDark()?"dark":"neutral"}); }
initMermaid();
var mmId=0;
async function renderDiagrams(root){
  var boxes = root.querySelectorAll("[data-mm]");
  for(var i=0;i<boxes.length;i++){
    var box=boxes[i], code=box.getAttribute("data-mm");
    try{
      if(!window.mermaid) throw new Error("Mermaid kütüphanesi yüklenemedi");
      var out = await mermaid.render("mm"+(++mmId), code);
      box.innerHTML = out.svg;
    }catch(e){
      box.innerHTML = '<p class="err">Bu şema çizilemedi. Kod aşağıda; n8n tarafında Mermaid sözdizimini kontrol edin.</p><pre class="code">'+esc(code)+'</pre>';
      document.querySelectorAll('[id^="dmm"]').forEach(function(n){ n.remove(); });
    }
  }
}

/* ========== Sesli okuma ========== */
var tts = { queue:[], idx:-1, paused:false, audioEl:null, onLine:null };
var player=$("#player"), pTitle=$("#pTitle"), pSub=$("#pSub"), pToggle=$("#pToggle");

function trVoices(){ var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[]; return v.filter(function(x){return /^tr/i.test(x.lang);}); }
function cleanText(t){ return String(t||"").replace(/\[[^\]]*\]/g," ").replace(/\s+/g," ").trim(); }
function directions(t){ var m=String(t||"").match(/\[[^\]]*\]/g)||[]; return m.join(" ").toLowerCase(); }

function stopSpeech(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(tts.audioEl){ tts.audioEl.pause(); tts.audioEl=null; }
  tts.queue=[]; tts.idx=-1; tts.paused=false;
  player.classList.remove("show","speaking");
  if(tts.onLine) tts.onLine(-1);
}
function speakQueue(items, title, onLine){
  if(!window.speechSynthesis){ alert("Tarayıcınız sesli okumayı desteklemiyor. Chrome, Edge veya Safari deneyin."); return; }
  stopSpeech();
  tts.queue=items; tts.idx=0; tts.onLine=onLine||null;
  pTitle.textContent=title; player.classList.add("show"); pToggle.textContent="Duraklat";
  next();
}
function next(){
  if(tts.idx<0||tts.idx>=tts.queue.length){ stopSpeech(); return; }
  var it=tts.queue[tts.idx], txt=cleanText(it.text);
  if(tts.onLine) tts.onLine(tts.idx);
  pSub.textContent = (it.speaker?it.speaker+": ":"")+txt.slice(0,90);
  if(!txt){ tts.idx++; next(); return; }
  var u=new SpeechSynthesisUtterance(txt); u.lang="tr-TR";
  var vs=trVoices();
  if(vs.length){ u.voice = vs[(it.speaker==="Uzman" && vs.length>1) ? 1 : 0]; }
  u.rate=1; u.pitch = it.speaker==="Uzman" ? .9 : 1.05;
  var d=directions(it.text);
  if(/coşkulu|heyecan/.test(d)){ u.rate=1.08; u.pitch+=.12; }
  if(/düşünceli|yavaş/.test(d)){ u.rate=.92; }
  u.onstart=function(){ player.classList.add("speaking"); };
  u.onend=function(){ if(tts.idx<0) return; var pause=/duraksama/.test(d)?0:0; tts.idx++; setTimeout(next,pause||250); };
  u.onerror=function(){ if(tts.idx<0) return; tts.idx++; next(); };
  speechSynthesis.speak(u);
}
pToggle.addEventListener("click",function(){
  if(tts.audioEl){ if(tts.audioEl.paused){tts.audioEl.play();pToggle.textContent="Duraklat";}else{tts.audioEl.pause();pToggle.textContent="Devam";} return; }
  if(!window.speechSynthesis) return;
  if(speechSynthesis.paused){ speechSynthesis.resume(); pToggle.textContent="Duraklat"; player.classList.add("speaking"); }
  else { speechSynthesis.pause(); pToggle.textContent="Devam"; player.classList.remove("speaking"); }
});
$("#pStop").addEventListener("click",stopSpeech);
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=function(){};

/* ========== Veri: webhook ve demo ========== */
function stripFences(s){ return String(s).replace(/^\s*```(?:json)?/i,"").replace(/```\s*$/,"").trim(); }
function normalize(raw, topic){
  var d=raw;
  if(Array.isArray(d)) d=d[0];
  if(d && typeof d==="object" && typeof d.output==="string") d=d.output;
  if(d && typeof d==="object" && d.json) d=d.json;
  if(typeof d==="string") d=JSON.parse(stripFences(d));
  if(!d || typeof d!=="object") throw new Error("Beklenmeyen yanıt biçimi");
  d.meta = d.meta||{}; d.meta.topic = d.meta.topic || topic;
  d.meta.generated_at = d.meta.generated_at_timestamp || d.meta.generated_at || new Date().toISOString();
  d.articles = Array.isArray(d.articles)?d.articles:[];
  d.technical_report = d.technical_report||null;
  d.visual_diagrams = Array.isArray(d.visual_diagrams)?d.visual_diagrams:[];
  d.audio_script = d.audio_script||null;
  if(d.audio_script && !Array.isArray(d.audio_script.dialogue)) d.audio_script.dialogue=[];
  return d;
}
async function fetchResearch(topic){
  if(cfg.demo || !cfg.webhook){ await new Promise(function(r){setTimeout(r,4200);}); return demoData(topic); }
  var MAX_TRIES=3, lastErr=null;
  for(var attempt=1; attempt<=MAX_TRIES; attempt++){
    var ctrl=new AbortController(); var to=setTimeout(function(){ctrl.abort();},180000);
    try{
      var res=await fetch(cfg.webhook,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({topic:topic,target_audience:cfg.audience}),signal:ctrl.signal});
      if(!res.ok) throw new Error("Sunucu "+res.status+" döndürdü");
      var txt=await res.text();
      var parsed; try{ parsed=JSON.parse(txt); }catch(e){ parsed=txt; }
      return normalize(parsed,topic);
    }catch(e){
      lastErr=e;
      /* Aralıklı hatalar (Gemini limiti/yoğunluk): kısa bekleyip tekrar dene */
      if(attempt<MAX_TRIES) await new Promise(function(r){setTimeout(r,4000);});
    }finally{ clearTimeout(to); }
  }
  throw lastErr;
}
function demoData(topic){
  var t=topic;
  return normalize({
    status:"success", demo:true,
    meta:{topic:t},
    articles:[
      {title:"Örnek makale 1: "+t+" için genel çerçeve",source:"Örnek veri",year:"—",url:"",
       one_liner:"Bu bir örnek kartın tek cümlelik özetidir; gerçek veri n8n'den gelecek.",
       key_points:["Kaynak metinden çıkan birinci ana fikir","İkinci ana fikir: yöntem ya da veri","Üçüncü ana fikir: sonuç ve sınırlılık"],
       memory_hook:"Akılda kalması için kısa bir benzetme: konu, bir şehrin metro haritası gibidir; önce hatları, sonra durakları öğren.",
       recall_q:"Bu makalenin tek cümlelik ana fikri neydi?",recall_a:"Kartın üstündeki tek cümleyi hatırlamaya çalış.",tags:["örnek","demo"]},
      {title:"Örnek makale 2: "+t+" alanında yöntem karşılaştırması",source:"Örnek veri",year:"—",url:"",
       one_liner:"İkinci örnek kart: yöntemler arasındaki farkı tek bakışta gösterir.",
       key_points:["Yöntem A hızlıdır ama sınırlıdır","Yöntem B daha doğrudur ama maliyetlidir"],
       memory_hook:"Hız mı doğruluk mu? Hatırlatma: \"A hızlı, B sağlam.\"",
       recall_q:"A ve B yöntemi arasındaki ana takas nedir?",recall_a:"Hız ile doğruluk arasındaki takas.",tags:["karşılaştırma"]}
    ],
    technical_report:{
      executive_summary:"Bu bölüm demo içeriğidir. Gerçek akışta n8n, kaynakları analiz edip burada en fazla 150 kelimelik yönetici özetini döndürür.",
      problem_statement:"Araştırılan konudaki temel teknik ya da akademik eksiklik burada yer alır.",
      methodology:"Kaynaklarda kullanılan yaklaşımlar, algoritmalar ve materyaller burada özetlenir.",
      findings_and_analysis:"Karşılaştırmalı bulgular ve sınırlılıklar burada listelenir.",
      future_scope_and_conclusion:"Gelecek çalışmalar ve sonuç burada verilir."
    },
    visual_diagrams:[
      {id:"flow",title:"Süreç akışı",mermaid_code:"flowchart TD\n  A[\"Konu girilir\"] --> B[\"n8n kaynakları toplar\"]\n  B --> C[\"Yapay zekâ özetler\"]\n  C --> D[\"Kartlar ve ses üretilir\"]"},
      {id:"mind",title:"Konu zihin haritası",mermaid_code:"mindmap\n  root((\""+t.replace(/["\n]/g," ")+"\"))\n    Yöntemler\n    Bulgular\n    Sınırlılıklar"}
    ],
    audio_script:{title:"Araştırma özeti",dialogue:[
      {speaker:"Sunucu",text:"[coşkulu] Merhaba! Bugün şu konuyu konuşuyoruz: "+t+". Bu, demo modunda çalışan örnek bir podcast."},
      {speaker:"Uzman",text:"[düşünceli] Gerçek akışta burada makalelerin ana bulgularını sadeleştirerek anlatacağım. [kısa duraksama] Ayarlar sayfasından n8n adresinizi girin."},
      {speaker:"Sunucu",text:"Harika. Dinlediğiniz için teşekkürler."}
    ]}
  }, topic);
}

/* ========== Yönlendirme ========== */
var routes={ "":pgHome, arastir:pgRun, sonuc:pgArticles, dinle:pgListen, rapor:pgReport, gecmis:pgHistory, ayarlar:pgSettings };
function route(){
  var r=(location.hash||"#/").replace(/^#\/?/,"").split("?")[0];
  var fn=routes[r]||pgHome;
  document.querySelectorAll(".rail a.nav").forEach(function(a){
    if(a.getAttribute("data-r")===r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  fn(); window.scrollTo(0,0);
  document.title = (current&&r&&r!=="arastir"? current.meta.topic+" · ":"")+"Hafıza Kartları";
}
window.addEventListener("hashchange",route);
function go(p){ location.hash="#/"+p; }

function needData(title){
  view.innerHTML='<h1>'+esc(title)+'</h1><p class="lead">Henüz bir araştırma yok. Bir konu yazarak başla.</p><p><a class="btn" href="#/" style="display:inline-block;text-decoration:none">Konu yaz</a></p>';
}

/* ========== Sayfalar ========== */
function pgHome(){
  var examples=["Kuantum bilgisayarlar","Büyük dil modellerinde halüsinasyon","Mikroplastiklerin sağlığa etkisi","Güneş pili verimliliği"];
  var recents=history.slice(0,3);
  view.innerHTML =
  '<section class="hero">'+
    '<h1>Konuyu yaz, <span class="mark">makaleleri</span> kartlarla öğren ve dinle.</h1>'+
    '<p class="lead">Yazdığın konu için makaleler bulunur, her biri tek cümleye, üç ana fikre ve akılda kalan bir benzetmeye indirilir. Sonra hepsini podcast olarak dinlersin.</p>'+
    '<form class="ask" id="askForm">'+
      '<label class="sr" for="topic" style="position:absolute;left:-9999px">Araştırma konusu</label>'+
      '<textarea id="topic" placeholder="Ne öğrenmek istiyorsun? Örn: mRNA aşılarının çalışma mekanizması" required></textarea>'+
      '<div class="row"><select id="aud" aria-label="Hedef kitle">'+
        ["Genel İzleyici","Akademisyen","Mühendis","Yatırımcı","Öğrenci"].map(function(a){return '<option'+(a===cfg.audience?' selected':'')+'>'+a+'</option>';}).join("")+
      '</select><button class="btn" type="submit">Araştır</button></div>'+
    '</form>'+
    '<div class="chips" aria-label="Örnek konular">'+examples.map(function(e){return '<button type="button" class="chip">'+esc(e)+'</button>';}).join("")+'</div>'+
    (cfg.demo||!cfg.webhook?'<p class="notice">Şu an <b>demo modundasın</b>: sonuçlar örnektir. Gerçek makaleler için Ayarlar sayfasına n8n webhook adresini gir.</p>':'')+
    (recents.length?'<h3 style="margin-top:38px">Son aramaların</h3><div class="hist">'+recents.map(function(h,i){return histItem(h,i);}).join("")+'</div>':'')+
  '</section>';
  $("#askForm").addEventListener("submit",function(e){
    e.preventDefault(); var v=$("#topic").value.trim(); if(!v) return;
    cfg.audience=$("#aud").value; save(KEY_CFG,cfg); pendingTopic=v; go("arastir");
  });
  view.querySelectorAll(".chip").forEach(function(c){ c.addEventListener("click",function(){ $("#topic").value=c.textContent; $("#topic").focus(); }); });
  bindHist();
}

function pgRun(){
  if(!pendingTopic){ go(""); return; }
  var topic=pendingTopic; pendingTopic="";
  var labels=["Kaynaklar toplanıyor","Makaleler okunuyor","Özetler akılda kalacak biçime getiriliyor","Şemalar çiziliyor","Podcast metni hazırlanıyor"];
  view.innerHTML='<h1>Araştırılıyor</h1><p class="lead">'+esc(topic)+'</p><ol class="steps" id="steps">'+labels.map(function(l){return '<li><span class="dot"></span>'+l+'</li>';}).join("")+'</ol><p style="color:var(--muted)">Bu işlem konuya göre 30 saniye ile birkaç dakika sürebilir.</p>';
  var items=view.querySelectorAll("#steps li"), i=0;
  function tick(){ items.forEach(function(li,k){ li.className = k<i?"done":k===i?"on":""; }); }
  tick();
  var timer=setInterval(function(){ if(i<items.length-1){ i++; tick(); } },cfg.demo||!cfg.webhook?800:12000);
  fetchResearch(topic).then(function(d){
    clearInterval(timer); current=d;
    history.unshift({topic:topic,at:new Date().toISOString(),data:d}); history=history.slice(0,10);
    var slim=history; save(KEY_HIST,slim);
    go("sonuc");
  }).catch(function(e){
    clearInterval(timer);
    var msg = e.name==="AbortError" ? "İstek 3 dakikada tamamlanmadı." : (e.message||"Bilinmeyen hata");
    view.innerHTML='<h1>Araştırma tamamlanamadı</h1><div class="err"><b>'+esc(msg)+'</b><br>Webhook adresini, CORS ayarını ve n8n akışının "Respond to Webhook" düğümünü kontrol et.</div><p><a class="btn" href="#/" style="display:inline-block;text-decoration:none">Tekrar dene</a> <a class="btn ghost" href="#/ayarlar" style="display:inline-block;text-decoration:none">Ayarlar</a></p>';
  });
}

function pgArticles(){
  if(!current){ needData("Makaleler"); return; }
  var a=current.articles;
  var h='<h1>'+esc(current.meta.topic)+'</h1>';
  if(current.demo) h+='<p class="notice">Demo verisi gösteriliyor.</p>';
  if(!a.length){ view.innerHTML=h+'<p>Bu araştırma için makale kartı dönmedi. Rapor ve podcast sayfalarına bakabilirsin.</p>'; return; }
  h+='<p class="lead" style="color:var(--muted)">'+a.length+' makale. Kartı oku, sarı satırı aklında tut, sonra kendini sına.</p>';
  h+='<div class="grid">'+a.map(function(x,i){
    var link=safeUrl(x.url);
    return '<article class="card"><div class="top"><div class="src">'+esc(x.source||"Kaynak")+(x.year?' &middot; '+esc(x.year):'')+'</div><h3>'+esc(x.title)+'</h3></div><div class="body">'+
      (x.one_liner?'<p class="oneliner">'+esc(x.one_liner)+'</p>':'')+
      ((x.key_points&&x.key_points.length)?'<ul class="pts">'+x.key_points.map(function(p){return '<li>'+esc(p)+'</li>';}).join("")+'</ul>':'')+
      (x.memory_hook?'<p class="hook"><small>Akılda kalsın</small>'+esc(x.memory_hook)+'</p>':'')+
      ((x.tags&&x.tags.length)?'<div class="tags">'+x.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</div>':'')+
      '<div class="actions"><button class="btn small" data-say="'+i+'" type="button">Bu kartı dinle</button>'+(link?'<a class="btn small ghost" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Kaynağı aç</a>':'')+'</div>'+
      (x.recall_q?'<div class="recall"><b>Kendini sına:</b> '+esc(x.recall_q)+'<div><button class="btn small ghost" data-rv type="button" style="margin-top:8px">Cevabı göster</button></div><div class="a">'+esc(x.recall_a||"")+'</div></div>':'')+
    '</div></article>';
  }).join("")+'</div>';
  view.innerHTML=h;
  view.querySelectorAll("[data-say]").forEach(function(b){
    b.addEventListener("click",function(){
      var x=a[+b.getAttribute("data-say")];
      var parts=[{text:x.title},{text:x.one_liner||""}].concat((x.key_points||[]).map(function(p){return {text:p};}));
      if(x.memory_hook) parts.push({text:"Akılda kalsın: "+x.memory_hook});
      speakQueue(parts,x.title);
    });
  });
  view.querySelectorAll("[data-rv]").forEach(function(b){
    b.addEventListener("click",function(){ b.closest(".recall").classList.add("open"); b.remove(); });
  });
}

function pgListen(){
  if(!current){ needData("Dinle"); return; }
  var s=current.audio_script;
  if(!s||!s.dialogue.length){ view.innerHTML='<h1>Dinle</h1><p>Bu araştırma için podcast metni dönmedi.</p>'; return; }
  var h='<h1>'+esc(s.title||"Araştırma özeti")+'</h1><p class="lead" style="color:var(--muted)">'+esc(current.meta.topic)+'</p>';
  var audioUrl=safeUrl(s.audio_url);
  h+='<div class="actions" style="margin-top:18px">'+
    '<button class="btn" id="playAll" type="button">Podcasti oynat</button>'+
    (audioUrl?'<button class="btn ghost" id="playFile" type="button">Hazır ses dosyasını çal</button>':'')+
    '</div><div class="script" id="script">'+
    s.dialogue.map(function(l,i){
      var dirs=(String(l.text).match(/\[[^\]]*\]/g)||[]).join(" ");
      return '<div class="line" data-i="'+i+'"><div class="who">'+esc(l.speaker||"")+'</div><p>'+(dirs?'<span class="dir">'+esc(dirs)+'</span> ':'')+esc(cleanText(l.text))+'</p></div>';
    }).join("")+'</div>';
  view.innerHTML=h;
  var lines=view.querySelectorAll(".line");
  function mark(i){ lines.forEach(function(el,k){ el.classList.toggle("cur",k===i); }); if(i>=0&&lines[i]) lines[i].scrollIntoView({block:"center",behavior:"smooth"}); }
  $("#playAll").addEventListener("click",function(){ speakQueue(s.dialogue,s.title||"Podcast",mark); });
  lines.forEach(function(el,k){ el.style.cursor="pointer"; el.addEventListener("click",function(){ speakQueue(s.dialogue.slice(k),s.title||"Podcast",function(j){mark(j<0?-1:j+k);}); }); });
  if(audioUrl) $("#playFile").addEventListener("click",function(){
    stopSpeech(); var au=new Audio(audioUrl); tts.audioEl=au; pTitle.textContent=s.title||"Podcast"; pSub.textContent="Ses dosyası"; pToggle.textContent="Duraklat";
    player.classList.add("show","speaking"); au.addEventListener("ended",stopSpeech); au.play().catch(function(){ pSub.textContent="Dosya çalınamadı"; });
  });
}

function pgReport(){
  if(!current){ needData("Rapor"); return; }
  var r=current.technical_report, h='<h1>Teknik rapor</h1><p class="lead" style="color:var(--muted)">'+esc(current.meta.topic)+'</p>';
  if(r){
    var secs=[["Yönetici özeti","executive_summary"],["Problem tanımı","problem_statement"],["Metodoloji","methodology"],["Bulgular ve analiz","findings_and_analysis"],["Gelecek çalışmalar ve sonuç","future_scope_and_conclusion"]];
    secs.forEach(function(p){ if(r[p[1]]) h+='<section class="rep"><h3>'+p[0]+'</h3><p>'+esc(r[p[1]])+'</p></section>'; });
  }
  var dg=current.visual_diagrams;
  if(dg.length){ h+='<h2 style="margin-top:34px">Şemalar</h2>'; dg.forEach(function(d){ h+='<h3>'+esc(d.title||d.id)+'</h3><div class="diagram" data-mm="'+esc(d.mermaid_code||"")+'">Çiziliyor…</div>'; }); }
  if(!r && !dg.length) h+='<p>Bu araştırma için rapor dönmedi.</p>';
  view.innerHTML=h; renderDiagrams(view);
}

function histItem(h,i){
  return '<div class="hitem"><div><b>'+esc(h.topic)+'</b><small>'+new Date(h.at).toLocaleString("tr-TR")+(h.data&&h.data.demo?' &middot; demo':'')+'</small></div><button class="btn small ghost" data-h="'+i+'" type="button">Aç</button></div>';
}
function bindHist(){
  view.querySelectorAll("[data-h]").forEach(function(b){ b.addEventListener("click",function(){ current=history[+b.getAttribute("data-h")].data; go("sonuc"); }); });
}
function pgHistory(){
  var h='<h1>Geçmiş</h1>';
  if(!history.length){ view.innerHTML=h+'<p>Henüz araştırma yok. Yaptığın aramalar burada, bu tarayıcıda saklanır.</p>'; return; }
  h+='<div class="hist">'+history.map(histItem).join("")+'</div><p style="margin-top:20px"><button class="btn ghost small" id="clr" type="button">Geçmişi temizle</button></p>';
  view.innerHTML=h; bindHist();
  $("#clr").addEventListener("click",function(){ history=[]; save(KEY_HIST,history); pgHistory(); });
}

function pgSettings(){
  view.innerHTML='<h1>Ayarlar</h1>'+
  '<label class="f">n8n webhook adresi<input type="url" id="wh" placeholder="https://n8n.siteniz.com/webhook/arastirma" value="'+esc(cfg.webhook)+'"></label>'+
  '<label class="check"><input type="checkbox" id="demo"'+(cfg.demo?' checked':'')+'> Demo modu (n8n yerine örnek veri göster)</label>'+
  '<p style="margin-top:18px"><button class="btn" id="saveCfg" type="button">Kaydet</button> <span id="ok" style="color:var(--ok);margin-left:8px"></span></p>'+
  '<h2 style="margin-top:40px">n8n ile sözleşme</h2>'+
  '<p>Site, webhook\'a <b>POST</b> ile şunu yollar:</p><pre class="code">{ "topic": "kullanıcının konusu", "target_audience": "Genel İzleyici" }</pre>'+
  '<p>Akışın sonundaki <b>Respond to Webhook</b> düğümü şu JSON\'u döndürmeli:</p><pre class="code">'+esc(JSON.stringify({
    meta:{topic:"..."},
    articles:[{title:"",source:"",year:"",url:"https://...",one_liner:"",key_points:["","",""],memory_hook:"",recall_q:"",recall_a:"",tags:[""]}],
    technical_report:{executive_summary:"",problem_statement:"",methodology:"",findings_and_analysis:"",future_scope_and_conclusion:""},
    visual_diagrams:[{id:"flow",title:"",mermaid_code:"flowchart TD\\n A-->B"}],
    audio_script:{title:"",audio_url:"(isteğe bağlı) https://...mp3",dialogue:[{speaker:"Sunucu",text:"[coşkulu] ..."},{speaker:"Uzman",text:"..."}]}
  },null,2))+'</pre>'+
  '<p>Webhook düğümünde <b>Allowed Origins (CORS)</b> alanına bu sitenin adresini ekle. Sesli okuma varsayılan olarak tarayıcının Türkçe sesini kullanır; ElevenLabs/OpenAI ile ürettiğin mp3 varsa <code>audio_url</code> olarak ekle.</p>';
  $("#saveCfg").addEventListener("click",function(){
    cfg.webhook=$("#wh").value.trim(); cfg.demo=$("#demo").checked; save(KEY_CFG,cfg);
    $("#ok").textContent="Kaydedildi";
  });
}

route();
})();
</script>
</body>
</html>
